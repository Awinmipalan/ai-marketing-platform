version: '3.8'

services:
  api:
      build: .
          ports:
                - "8000:8000"
                    env_file:
                          - .env
                              depends_on:
                                    - postgres
                                          - redis
                                              volumes:
                                                    - .:/app

                                                      postgres:
                                                          image: postgres:15
                                                              environment:
                                                                    POSTGRES_USER: user
                                                                          POSTGRES_PASSWORD: password
                                                                                POSTGRES_DB: marketing
                                                                                    ports:
                                                                                          - "5432:5432"
                                                                                              volumes:
                                                                                                    - postgres_data:/var/lib/postgresql/data

                                                                                                      redis:
                                                                                                          image: redis:7
                                                                                                              ports:
                                                                                                                    - "6379:6379"

                                                                                                                      chromadb:
                                                                                                                          image: chromadb/chroma
                                                                                                                              ports:
                                                                                                                                    - "8001:8000"
                                                                                                                                        volumes:
                                                                                                                                              - chroma_data:/chroma/chroma

                                                                                                                                              volumes:
                                                                                                                                                postgres_data:
                                                                                                                                                  chroma_data: